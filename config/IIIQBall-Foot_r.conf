# ===== 基本設定 (Central) =====
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y

# 左右およびフットスイッチ（子機）の情報を取得するための設定
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# トラックボール・ポインティング設定
CONFIG_SPI=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

# エンコーダー設定
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Studio設定
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 通信設定 (安定性のために2M PHYをオフ)
CONFIG_BT_CTLR_PHY_2M=n

# ===== Prospector (Status Advertisement) 設定 =====
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="IIIQBall-R"

# 表示位置の設定（右手親機なら通常 "RIGHT" ですが、お好みに合わせて）
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"

# 電力と更新頻度
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000

# WPM計算ウィンドウ (秒)
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30

# ===== 3分割用のスロット割り当て =====
# 左手側(l)を想定
CONFIG_ZMK_STATUS_ADV_HALF_PERIPHERAL=0
# フットスイッチ側(f)を想定
CONFIG_ZMK_STATUS_ADV_AUX1_PERIPHERAL=1