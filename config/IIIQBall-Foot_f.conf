# ===== 基本設定 =====
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y

# 左右（子機）の情報を取得するための設定
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ポインティング・Studio設定
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ===== Prospector (Status Advertisement) 設定 =====
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
# 名前は最大8文字推奨（IIIQBall など）
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="IIIQBall-foot"

# 表示位置の設定（ドングルを左端または右端のどちらとして表示するか）
# ここでは "LEFT" に設定し、子機を中央と右に配置するイメージにします
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"

# 電力と更新頻度
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000

# WPM計算ウィンドウ (秒)
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30

# ===== 3分割用のスロット割り当て =====
# ドングルに最初に繋がった方を HALF(0)、次に繋がった方を AUX1(1) とします
# 左右が逆になった場合は、この 0 と 1 を入れ替えてください
CONFIG_ZMK_STATUS_ADV_HALF_PERIPHERAL=0         # 左手側(l)を想定
CONFIG_ZMK_STATUS_ADV_AUX1_PERIPHERAL=1         # 右手側(r)を想定